# --- Buddy library -----------------------------------------------------------
CONFIG_ZBUDDY=y

# --- Kernel ------------------------------------------------------------------
# The main thread runs LVGL and the pet; it sleeps every iteration so that
# the Bluetooth, input, log and shell threads get the processor.
CONFIG_MAIN_THREAD_PRIORITY=12
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_BASE64=y
CONFIG_REBOOT=y

# --- Character packs and settings on flash ----------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Display and touch (LVGL) -------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_QUEUE_MAX_MSGS=64
# The input thread runs the LVGL pointer callback, which logs when LVGL's
# queue is full; the default 1024 bytes overflowed on the ESP32-S3
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_LVGL=y
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_THEME_DEFAULT_DARK=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_GIF=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_UNSCII_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
