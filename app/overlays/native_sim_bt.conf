#
# native_sim with real Bluetooth through the Linux host's adapter (HCI user
# channel), so Claude Desktop on another machine can pair with the
# simulator:
#   west build ... -- -DEXTRA_CONF_FILE=overlays/native_sim_bt.conf \
#                      -DEXTRA_DTC_OVERLAY_FILE=overlays/native_sim_bt.overlay
#   sudo btmgmt -i hci0 power off        # Zephyr takes the adapter over
#   sudo ./zephyr.exe --bt-dev=hci0 --flash=buddy.bin

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Claude"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_GATT_CLIENT=n
