#
# VIEWE UEDX32480035E-WB-A (ESP32-S3): the BLE link to Claude Desktop, the
# character packs on the 16 MB flash, LVGL's pool and the GIFs in PSRAM.

CONFIG_ESP_SPIRAM=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_Z_MEM_POOL_SIZE=524288
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=5
# Render the next strip while the previous one goes out over SPI
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_DOUBLE_VDB=y

# --- Bluetooth LE: peripheral with the Nordic UART Service, LE Secure
# Connections with a passkey shown on the display, bonds in the settings
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Claude"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_GATT_CLIENT=n
# Show the desktop's traffic on the console while the link is being brought up
CONFIG_ZBUDDY_APP_BRIDGE_DEBUG=y

# --- The RGB LED blinks on a pending approval, the buzzer chirps
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_BUZZER=y
