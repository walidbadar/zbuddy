# native_sim/native/64: the SDL window stands in for the display, the mouse
# for the touch screen, a pseudo terminal (uart1) for the BLE link and the
# flash simulator (--flash=<file>) for the character storage and settings.

CONFIG_LV_COLOR_DEPTH_32=y
# The native backend prints the logs; the UART one would print them twice
CONFIG_LOG_BACKEND_UART=n

# Room for lv_snapshot_take() of the whole screen (--shot) and the GIFs
CONFIG_LV_USE_SNAPSHOT=y
CONFIG_LV_Z_MEM_POOL_SIZE=4194304

# Character packs are read into the kernel heap
CONFIG_HEAP_MEM_POOL_SIZE=16777216

# The console (logs) on the terminal; the bridge is uart1 on its own pty
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
