name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zbuddy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config

      - name: Set up the Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: zbuddy
          toolchains: xtensa-espressif_esp32s3_zephyr-elf

      - name: Fetch the ESP32-S3 blobs
        working-directory: zbuddy
        run: west blobs fetch hal_espressif --allow-regex 'lib/esp32s3/.*'

      - name: Build the application
        working-directory: zbuddy
        run: west twister -T app -v --inline-logs --integration

      - name: Run the unit tests
        working-directory: zbuddy
        run: west twister -T tests -v --inline-logs --integration
